project:
  name: "Cardiac Digital Twin (PINN)"
  version: "0.1.0"
  phase: 5
  description: "PINN pipeline for personalized cardiac digital twins."

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  logs: "logs"

logging:
  level: "INFO"
  log_to_file: true
  log_filename: "project.log"

signal_processing:
  sampling_rate_hz: 250
  bandpass_low_hz: 0.5
  bandpass_high_hz: 40.0
  filter_order: 4
  powerline_freq_hz: 50.0
  max_heart_rate_bpm: 220

dataset:
  database: "mitdb"           # MIT-BIH Arrhythmia Database on PhysioNet
  sample_records: ["100"]     # start with one record; expand once verified
  native_sampling_rate_hz: 360  # MIT-BIH's actual recording rate
